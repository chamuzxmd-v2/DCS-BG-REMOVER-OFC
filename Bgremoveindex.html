<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCS BACKGROUND REMOVER</title>

<style>
*{
  box-sizing: border-box;
}

body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#0b0f0c;
  color:#fff;
  overflow-x:hidden;
}

/* Animated Neon Background */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,255,120,0.15), transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(0,255,120,0.12), transparent 40%);
  animation: moveBg 10s infinite alternate;
  z-index:-1;
}

@keyframes moveBg{
  from{transform:translateY(0);}
  to{transform:translateY(-40px);}
}

.container{
  padding:20px;
  max-width:420px;
  margin:auto;
  text-align:center;
}

h1{
  color:#00ff7f;
  margin-bottom:10px;
  text-shadow:0 0 10px #00ff7f;
}

input[type=file]{
  width:100%;
  padding:12px;
  margin:15px 0;
  border-radius:8px;
  background:#111;
  border:1px solid #00ff7f;
  color:#fff;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#00ff7f;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,120,0.6);
}

button:hover{
  opacity:0.9;
}

img{
  max-width:100%;
  margin-top:20px;
  border-radius:10px;
  display:none;
  box-shadow:0 0 20px rgba(0,255,120,0.5);
}

#downloadBtn{
  display:none;
  background:#111;
  color:#00ff7f;
  border:1px solid #00ff7f;
  margin-top:15px;
}

footer{
  margin-top:30px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>
<div class="container">
  <h1>🥶 DCS BACKGROUND REMOVER 🥶</h1>
  <p>Upload photo → Remove background → Download ✨</p>

  <input type="file" id="fileInput" accept="image/*">

  <button onclick="removeBackground()">Remove Background</button>

  <img id="outputImage">

  <button id="downloadBtn" onclick="downloadImage()">Download</button>

  <footer>
    © 2026 POWERED BY D4RK CYB3R SASA
  </footer>
</div>

<script>
let imageBlobUrl = "";

async function removeBackground(){
  const fileInput = document.getElementById("fileInput");
  if(!fileInput.files[0]){
    alert("Please upload an image first!");
    return;
  }

  const formData = new FormData();
  formData.append("image_file", fileInput.files[0]);

  const response = await fetch("https://api.remove.bg/v1.0/removebg",{
    method:"POST",
    headers:{
      "X-Api-Key":"axju4rEUaq5U2CQd6BnGanTh"
    },
    body:formData
  });

  if(response.ok){
    const blob = await response.blob();
    imageBlobUrl = URL.createObjectURL(blob);

    const img = document.getElementById("outputImage");
    img.src = imageBlobUrl;
    img.style.display = "block";

    document.getElementById("downloadBtn").style.display="block";
  }else{
    alert("Background remove failed!");
  }
}

function downloadImage(){
  const a = document.createElement("a");
  a.href = imageBlobUrl;
  a.download = "bg-removed.png";
  a.click();
}
</script>

</body>
</html>
